# Checkov configuration for the agentic-evaluation reference deployment.
#
# Suppressions below are deliberate and documented. Each entry explains why the
# finding does not apply to this codebase so a reviewer can audit the decision.

skip-check:
  # CKV_OPENAPI_5 — "Ensure that security operations is not empty."
  #
  # Why skipped: the only operations in dealer-api.json with `security: []` are
  # the CORS preflight OPTIONS operations (operationId corsPreflightDealers,
  # corsPreflightDealerDetails). Per the CORS specification, browsers send
  # preflight OPTIONS requests WITHOUT credentials, so these operations must be
  # unauthenticated by design. All data-returning operations require API Gateway
  # IAM SigV4 authorization in the CDK deployment.
  - CKV_OPENAPI_5

  # CKV_AWS_18 — the access-log bucket cannot send server-access logs to itself
  # without creating a recursive log stream. It is a dedicated encrypted,
  # versioned, TLS-only sink; the application data bucket logs to it.
  - CKV_AWS_18

  # CKV_AWS_117 — both Lambdas are managed, non-public compute with no inbound
  # network interface. They call AWS APIs only. VPC attachment would add NAT or
  # endpoint cost and failure modes without reducing their reachable surface.
  - CKV_AWS_117

  # CKV_AWS_116 — the ingestion Lambda has a function-level DLQ. The Dealer API
  # Lambda is invoked synchronously by API Gateway, where Lambda DLQs do not
  # apply; API Gateway propagates failures and CloudWatch alarms monitor them.
  - CKV_AWS_116

  # CKV_AWS_120 — dealer profiles are authenticated, identity-scoped, mutable
  # data. Stage caching is deliberately disabled to avoid stale or incorrectly
  # keyed authorization data and the fixed API Gateway cache-cluster charge.
  - CKV_AWS_120
