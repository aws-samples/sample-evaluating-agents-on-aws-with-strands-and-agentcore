name: sdk-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repo to lint, test, and build.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (SDK + dev)
        working-directory: repo
        run: uv sync --all-extras --dev

      - name: Ruff lint
        working-directory: repo
        run: uv run ruff check .

      - name: Ruff format --check
        working-directory: repo
        run: uv run ruff format --check .

      # The type half of the gate. Scope and strictness live in
      # [tool.pyright]; it resolves the synced .venv this job just created, so
      # third-party imports are checked rather than reported missing.
      - name: Pyright
        working-directory: repo
        run: uv run pyright

      - name: Offline unit tests with coverage
        working-directory: repo
        run: |
          uv run pytest -m "not deployed" \
            --cov=agentic_evaluation --cov-report=term-missing \
            --cov-fail-under=70 \
            -v --tb=short

      - name: agentic-eval CLI smoke
        working-directory: repo
        run: uv run agentic-eval --help

  security-and-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install project dependencies
        working-directory: repo
        run: uv sync --all-extras --dev --frozen

      # pipefail matters here: the default shell is `bash -e`, so without it a
      # failing `uv export` would be masked by pip-audit's exit code and the
      # gate would pass having audited nothing.
      - name: Audit frozen project dependencies
        working-directory: repo
        run: |
          set -o pipefail
          uv export --frozen --no-dev --all-extras --no-emit-project \
            --format requirements-txt |
            uvx --from pip-audit==2.10.1 pip-audit \
              -r /dev/stdin --no-deps --disable-pip

      # Every uv-managed project except the root. The CDK app and both Lambda
      # functions deploy to AWS, so their locks are gated here rather than left
      # to Dependabot alone.
      - name: Audit CDK and Lambda dependencies
        working-directory: repo
        run: |
          set -o pipefail
          for project in \
            examples/vehicle-auction-agent/cdk \
            examples/vehicle-auction-agent/lambda/functions/data_ingestion \
            examples/vehicle-auction-agent/lambda/functions/dealer_api
          do
            echo "::group::pip-audit $project"
            uv export --frozen --no-dev --no-emit-project \
              --format requirements-txt --project "$project" |
              uvx --from pip-audit==2.10.1 pip-audit \
                -r /dev/stdin --no-deps --disable-pip
            echo "::endgroup::"
          done

      # requirements.lock is what the runtime image installs (see the agent
      # Dockerfile: `pip install --require-hashes -r requirements.lock`), but
      # Dependabot can only edit requirements.txt -- it does not parse a
      # `.lock` filename, and the floor-only requirements.txt resolves to no
      # concrete version, so that tree produces no alerts either. Nothing tied
      # the two files together, which let a floor bump merge while the pin that
      # actually deploys stayed behind. Recompiling and diffing turns that
      # silent drift into a failed build.
      #
      # Deterministic on purpose: `uv pip compile` prefers the versions already
      # in --output-file and only moves one when requirements.txt or
      # constraints.txt stops permitting it. A new upstream release therefore
      # does not turn this red; a stale lock does.
      - name: Verify agent requirements.lock is in sync
        working-directory: repo/examples/vehicle-auction-agent/agent
        run: |
          cp requirements.lock requirements.lock.committed
          uv pip compile requirements.txt \
            --constraint constraints.txt \
            --python-platform aarch64-manylinux_2_28 \
            --python-version 3.14 \
            --generate-hashes --only-binary :all: \
            --output-file requirements.lock --quiet
          if ! diff -u requirements.lock.committed requirements.lock; then
            echo "::error::requirements.lock does not match requirements.txt. Regenerate it with the command in the lock header and commit the result."
            exit 1
          fi
          rm requirements.lock.committed
          echo "in sync: $(grep -cE '^[a-zA-Z0-9][^ ]*==' requirements.lock) pinned packages"

      - name: Audit deployable agent dependencies
        working-directory: repo
        run: |
          uvx --from pip-audit==2.10.1 pip-audit \
            -r examples/vehicle-auction-agent/agent/requirements.lock \
            --no-deps --disable-pip

      - name: Bandit
        working-directory: repo
        run: |
          uvx --from bandit==1.9.4 bandit -r \
            src scripts examples/vehicle-auction-agent/agent \
            examples/vehicle-auction-agent/cdk/lib -ll

      - name: Detect committed secrets # pragma: allowlist secret
        working-directory: repo
        run: |
          uvx --from detect-secrets==1.5.0 detect-secrets scan . \
            --exclude-files '(^|/)\.pre-commit-config\.yaml$' \
            --exclude-lines '(?i)detect[- ](?:committed[- ])?secrets' \
            > "$RUNNER_TEMP/detect-secrets.json"
          jq -e '.results == {}' "$RUNNER_TEMP/detect-secrets.json"

      - name: Install CDK dependencies and CLI
        working-directory: repo/examples/vehicle-auction-agent/cdk
        run: |
          uv sync --frozen
          npm install --global aws-cdk@2.1138.0

      - name: Synthesize all CDK stacks
        working-directory: repo/examples/vehicle-auction-agent/cdk
        env:
          AWS_ACCOUNT_ID: "111122223333"
          AWS_REGION: eu-west-1
          AGENT_IMAGE_URI: 111122223333.dkr.ecr.eu-west-1.amazonaws.com/agent-eval-runtime@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"
        run: |
          uv run cdk synth --output "$RUNNER_TEMP/cdk.out" -c environment=dev

      - name: Validate synthesized CloudFormation
        working-directory: repo
        run: |
          while IFS= read -r template; do
            uvx --from cfn-lint==1.55.1 cfn-lint \
              -t "$template" --ignore-checks W3005
          done < <(find "$RUNNER_TEMP/cdk.out" -maxdepth 1 \
            -name '*.template.json' -print)

      - name: Reject wildcard IAM actions
        working-directory: repo
        run: |
          while IFS= read -r template; do
            if jq -e '
              .. | objects | .Action? // empty
              | if type == "array" then .[] else . end
              | select(type == "string" and contains("*"))
            ' "$template" >/dev/null; then
              echo "Wildcard IAM action found in $template"
              exit 1
            fi
          done < <(find "$RUNNER_TEMP/cdk.out" -maxdepth 1 \
            -name '*.template.json' -print)

      - name: Checkov
        working-directory: repo
        run: |
          uvx --from checkov==3.3.13 checkov \
            -d "$RUNNER_TEMP/cdk.out" \
            --framework cloudformation \
            --config-file .checkov.yaml \
            --compact

  build-wheel:
    needs: [lint-and-test, security-and-iac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build sdist + wheel
        working-directory: repo
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: repo/dist/
