repos:
  - repo: https://github.com/awslabs/git-secrets
    # Pinned to awslabs/git-secrets master (the project publishes no tags). The
    # previous pin (99d01d58…) is not a reachable object upstream, which made
    # `pre-commit` fail to initialize the whole hook set.
    rev: "7d6b970cbd3c216353cb22b383b70c150140662e"
    hooks:
      - id: git-secrets
        name: git-secrets
        entry: git-secrets --scan
        language: system
        types: [text]

  # Pinned to match the ruff version in pyproject.toml (dev group) and CI, so
  # the local hook and CI format/lint identically. 0.15.x is intentionally
  # avoided (its formatter rewrites valid `except (A, B):` into a SyntaxError).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix, --ignore, E501]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]
