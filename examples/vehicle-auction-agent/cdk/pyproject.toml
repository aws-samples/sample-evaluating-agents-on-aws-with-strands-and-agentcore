[project]
name = "agentic-evaluation-cdk"
version = "0.1.0"
description = "CDK infrastructure for agent evaluation pipeline"
requires-python = ">=3.14"
dependencies = [
    "aws-cdk-lib>=2.241.0",
    "constructs>=10.0.0",
    "boto3>=1.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
