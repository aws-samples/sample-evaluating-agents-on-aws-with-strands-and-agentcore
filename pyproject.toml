[project]
name = "agentic-evaluation"
version = "0.6.0"
description = "Universal three-layer evaluation SDK for AI agents"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT-0"
dependencies = [
    "boto3>=1.43.46",
    "pyyaml>=6.0",
    # 1.x changed run_evaluations() to return one flat report across
    # evaluators x cases instead of a list of per-evaluator reports;
    # agentic_evaluation.reports_by_evaluator() regroups it. Bounded on both
    # sides deliberately: an unbounded floor let a fresh `pip install` resolve
    # 1.2.0 against code written for the 0.x shape, which raised
    # AttributeError at run time for every consumer.
    "strands-agents-evals>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
strands = [
    "strands-agents>=1.29.0",
]
agentcore = [
    # Intentionally empty, and kept as a name so documented install lines
    # (`pip install "agentic-evaluation[agentcore]"`) keep resolving.
    #
    # `agentic_evaluation.adapters.agentcore` reaches a deployed runtime through
    # the boto3 *service* client for "bedrock-agentcore" -- not the
    # bedrock-agentcore *package* -- and boto3 is already a core dependency, so
    # this adapter needs no extra packages to import or run.
    #
    # bedrock-agentcore, mcp, mcp-proxy-for-aws and lancedb used to live here.
    # Nothing under src/ imports any of them: their only consumer is the
    # reference agent under examples/, which the wheel does not ship
    # ([tool.hatch.build.targets.wheel] packages = ["src/agentic_evaluation"]).
    # Declaring them here forced every consumer to install four packages the
    # library never uses -- including an exact `lancedb==` pin that would
    # deadlock any consumer needing a different lancedb. They now live in the
    # `dev` dependency group, which PEP 735 keeps out of wheel metadata.
]
http = [
    "requests>=2.31.0",
]
aws = [
    "aws-cdk-lib>=2.241.0",
    "constructs>=10.0.0",
]
all = [
    # Union of the extras that carry packages: strands + http. The agentcore
    # extra is empty (see above) and aws is deployment-only tooling, kept out of
    # `all` so `pip install "agentic-evaluation[all]"` does not drag in the CDK.
    "strands-agents>=1.29.0",
    "requests>=2.31.0",
]

[project.scripts]
agentic-eval = "agentic_evaluation.cli:main"

[project.entry-points."agentic_evaluation.judges"]
strands = "agentic_evaluation.judges:StrandsJudgeBackend"
noop = "agentic_evaluation.judges:NoOpJudgeBackend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_evaluation"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    # Pinned exactly and kept in lockstep with .pre-commit-config.yaml, so the
    # local hook and CI format identically -- an unpinned formatter reformats
    # the tree on whichever machine upgrades first.
    #
    # This was previously held at 0.14.14 on the belief that 0.15.x rewrote
    # valid `except (A, B):` into a SyntaxError. It does not: PEP 758 makes the
    # unparenthesized form valid from Python 3.14, and `target-version = "py314"`
    # (correct -- see below) is what asks the formatter to apply it. So this tree
    # now contains `except A, B:`, which will not parse on 3.13 or older. That is
    # already true of the SDK for a second reason: test_cases.py annotates its own
    # class by bare name, which needs PEP 649. Documented invocations therefore go
    # through `uv run`, so the pinned 3.14 interpreter is the one that runs.
    "ruff==0.16.4",
    "pyright>=1.1.407",
    # Reference-agent dependencies, not library dependencies. tests/conftest.py
    # puts examples/vehicle-auction-agent on sys.path so the unit suite can
    # `import agent.app`, which imports lancedb, numpy, pandas and pyarrow
    # directly and reaches mcp + mcp-proxy-for-aws through utils.gateway.
    # A dependency group is the right home: PEP 735 keeps it entirely out of
    # wheel metadata, so these never reach a consumer of the published package.
    #
    # Floor is a security minimum: < 1.18.1 is vulnerable to CVE-2026-16796
    # (argument injection in Code Interpreter install_packages()).
    "bedrock-agentcore[strands-agents]>=1.21.0",
    # Exact pin kept in lockstep with the reference agent's requirements.txt so
    # the tested and deployed LanceDB readers cannot diverge.
    "lancedb==0.37.1",
    # Floor is a security minimum: < 1.28.1 is vulnerable to CVE-2026-59950
    # (the WebSocket server transport does not validate Host/Origin). The agent
    # consumes MCP only as a client, but keep the floor.
    "mcp>=1.29.0",
    "mcp-proxy-for-aws>=1.6.4",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
]

[tool.uv]
# Security floors for packages we do not depend on directly. Expressed as
# constraints rather than dependencies: they raise the minimum the resolver may
# pick without making these packages part of our public dependency surface, and
# unlike a bare `uv lock --upgrade-package` they survive future re-resolution.
# Remove an entry once every transitive parent requires the fixed version.
constraint-dependencies = [
    # aiohttp arrives via strands-agents-evals -> strands-agents-tools.
    # < 3.14.3 is vulnerable to CVE-2026-69244 (out-of-bounds heap read in the
    # C response parser), plus CVE-2026-69243 and CVE-2026-59881 (WebSocket).
    "aiohttp>=3.14.3",
    # cryptography arrives via authlib, joserfc, pyjwt[crypto] and secretstorage.
    # 44.0.0 <= version < 50.0.0 is vulnerable to CVE-2026-69247 (Bleichenbacher
    # oracle in PKCS#7 EnvelopedData decryption).
    "cryptography>=50.0.0",
    # pillow arrives via strands-agents-evals -> strands-agents-tools.
    # < 12.3.0 is vulnerable to thirteen advisories, including heap
    # out-of-bounds writes in ImageFilter.RankFilter, Image.paste()/crop() and
    # ImageCmsTransform.apply() (CVE-2026-59197, CVE-2026-59199,
    # CVE-2026-59205) and several decompression-bomb bypasses in the font and
    # PDF parsers.
    "pillow>=12.3.0",
]

[tool.pyright]
# The type half of the quality gate; ruff owns the lint half. Both run in CI.
# venvPath/venv are required: without them pyright resolves nothing from the
# project environment and reports every third-party import as missing, which
# buries the real diagnostics under ~40 false positives.
venvPath = "."
venv = ".venv"
include = ["src"]
pythonVersion = "3.14"
# Pinned rather than left to the default so a pyright release cannot silently
# tighten or loosen the gate.
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Every rule family that encodes a project standard: typed public signatures
# (ANN), Google docstrings on public APIs (D), absolute top-level imports
# (TID/PLC0415), no dead code (F/ARG/ERA), arity and complexity ceilings (PL),
# logging rather than print (T20/G/LOG), and current-version idioms (UP).
# Deviations are enumerated in `ignore` with a reason; directory-level
# relaxations live in per-file-ignores. Adding a rule family here is cheap;
# silently dropping one is how a standard stops being enforced.
select = [
    "A",    # flake8-builtins          — no shadowing builtins
    "ANN",  # flake8-annotations       — typed signatures
    "ARG",  # flake8-unused-arguments  — no dead parameters
    "B",    # flake8-bugbear           — likely bugs
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle (google)      — documented public APIs
    "DTZ",  # flake8-datetimez         — timezone-aware datetimes only
    "E",    # pycodestyle errors
    "ERA",  # eradicate                — no commented-out code
    "F",    # pyflakes
    "G",    # flake8-logging-format
    "I",    # isort                    — deterministic import order
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PL",   # pylint                   — arity/complexity ceilings
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "T20",  # flake8-print             — logging, not print
    "TID",  # flake8-tidy-imports      — absolute imports only
    "TRY",  # tryceratops              — no blind/pointless error handling
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    # `ruff format` owns line breaking. What it leaves long is a URL, a literal,
    # or a table it cannot legally split, so E501 would only ever re-flag lines
    # the formatter already decided about.
    "E501",
    # Demands a bespoke exception subclass per message. Satisfying it would add
    # ~96 single-use classes whose only content is a string, trading a specific
    # message at the raise site for indirection — more code, less clarity.
    "TRY003",
    # `Any` is the honest annotation at genuinely dynamic boundaries: boto3
    # response dicts, the Lambda `context` object, decoded JSON. ANN001/201/202
    # stay on, so an annotation is still mandatory — this only permits `Any` to
    # be the one written.
    "ANN401",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
# Project standard: absolute imports only, no `from ..x import y`.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests are specifications, not a public API, and they are read top-to-bottom:
# a docstring and `-> None` on every `test_*` adds ceremony without
# information (D, ANN); importing inside a test is how import-time behaviour
# and monkeypatched modules get exercised (PLC0415); pytest fixtures are
# requested by name even when only their side effect is wanted (ARG); and
# asserts, dummy credentials and literal expected values are the substance of
# a test, not smells (S101/S105/S106, PLR2004).
"tests/**" = [
    "ANN",
    "ARG",
    "D",
    "PLC0415",
    "PLR2004",
    "S101",
    "S105",
    "S106",
]
# The layer-by-layer score breakdown these tests print *is* their operator
# output (read under `pytest -s` when judging a real deployment). Scoped to
# integration only: a `print` under tests/unit or tests/sdk is debug cruft and
# stays an error there.
"tests/integration/**" = ["T201"]
# For an operator CLI, stdout is the interface — `print` is the deliverable,
# not a logging misuse. Status and diagnostics in these files still go through
# `logging`; only the user-facing result is printed.
"scripts/**" = ["T201"]
"quickstart/**" = ["T201"]
# T201 as above. TRY400 (`logger.exception` over `logger.error`) is deliberately
# not followed for the caught, expected failures this module maps to exit code 2
# — a bad config path or a typo'd task_fn is a user error, and the actionable
# one-line message is the right output, not a stack trace. The genuinely
# unexpected path (exit code 3) does use `logger.exception`.
"src/agentic_evaluation/cli.py" = ["T201", "TRY400"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=agentic_evaluation --cov-report=term-missing"
markers = [
    "deployed: tests that require deployed AWS infrastructure (deselect with '-m not deployed')",
    "sdk: SDK-only tests (no AWS, no LLM)",
    "reference: reference deployment tests (car-auction agent)",
]
